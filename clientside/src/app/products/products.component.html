<div class="container">
	<div class="mt-4">
		<h5>ALL PRODUCTS</h5>
		<hr>
	</div>

	<div class="row">

  	<!-- Content from the server -->
    <div class="col-md-3 my-2 px-2" *ngFor="let product of products">

    	<div class="card shadow-0 border border-success">
			<div class="card-header p-2">
				<div>
					<img src="{{product.imglinks}}" class="img-fluid">
				</div>
			</div>

			<div class="card-body p-2">
				<p class="text-truncate m-2 fw-bold">{{product.name}}</p>
				<div class="d-flex justify-content-between">
					<p class="text-truncate m-2 text-success fs-5">₱ {{product.price}}</p>
					<p class="text-truncate m-2">In Stock: {{product.stocks}}</p>
				</div>

        <button class="btn btn-success btn-block bi bi-cart-plus" (click)="callToCarts(product.name,product.stocks,product.price,product.imglinks)">   ADD TO CART</button>
			</div>
		</div>
    </div>
  </div>

  <hr>
  <app-carts></app-carts>

</div>
